spring.application.name=shop-app

# Supabase (PostgreSQL) Data Source Configuration
# Injected via environment variables (SUPABASE_DB_URL, SUPABASE_DB_USERNAME, SUPABASE_DB_PASSWORD)
spring.datasource.url=${SPRING_DATASOURCE_URL:${SUPABASE_DB_URL:jdbc:postgresql://aws-0-ap-northeast-2.pooler.supabase.com:5432/postgres?sslmode=require}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${SUPABASE_DB_USERNAME:postgres.dvtrrmskgyqiolbmqhxi}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${SUPABASE_DB_PASSWORD:Cute.kaayoko1}}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

inventory.low-stock-threshold=${INVENTORY_LOW_STOCK_THRESHOLD:5}
legacy.api-key=${LS_API_KEY:}
tiangge.base-url=${TIANGGE_BASE_URL:https://legacysupply.onrender.com/tiangge/v1}
tiangge.client-id=${TIANGGE_CLIENT_ID:${STUDENT_ID:}}
tiangge.api-key=${TIANGGE_API_KEY:${LS_API_KEY:}}
tiangge.poll-ms=${TIANGGE_POLL_MS:5000}
tiangge.heartbeat-ms=${TIANGGE_HEARTBEAT_MS:30000}

server.port=8080